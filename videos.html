<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Videos</title>
<meta name="description" content="Every episode of the free Claude certification video series, in study order, each linked to its study notes and hands-on build. Unofficial.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 120'%3E%3Cpolygon points='60,4 108,32 108,88 60,116 12,88 12,32' fill='%23FF8500'/%3E%3Cpolygon points='60,22 92,41 92,79 60,98 28,79 28,41' fill='%233D405B'/%3E%3C/svg%3E">
<link rel="stylesheet" href="theme.css">
<style>
  *{box-sizing:border-box; margin:0; padding:0;}
  .wrap{max-width:1440px; margin:0 auto; padding:0 28px;}
  .label{display:block; font-size:13px; font-weight:800; letter-spacing:1px; text-transform:uppercase; color:var(--orange-ink); margin-bottom:6px;}
  .head{padding:30px 0 6px; display:flex; flex-wrap:wrap; gap:18px; align-items:end; justify-content:space-between;}
  .head h1{font-size:44px; line-height:1.1; color:var(--slate-deep);}
  .head p{color:var(--muted); max-width:760px; margin-top:8px;}
  .btn{font:inherit; font-size:16px; font-weight:700; border:2px solid var(--line); background:var(--card); color:var(--ink); border-radius:10px; padding:10px 16px; text-decoration:none; display:inline-flex; gap:8px; align-items:center;}
  .btn.primary{background:var(--orange); border-color:var(--orange);}
  .btn:hover{border-color:var(--orange);}
  h2{font-size:22px; margin:30px 0 14px; color:var(--slate-deep); display:flex; gap:12px; align-items:baseline;}
  h2 small{font-size:14.5px; color:var(--muted); font-weight:600;}
  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(310px,1fr)); gap:20px;}
  .card{background:var(--card); border:1px solid var(--line); border-radius:16px; overflow:hidden; display:flex; flex-direction:column; box-shadow:var(--shadow);}
  .thumb{position:relative; display:block; aspect-ratio:16/9; background:var(--slate-deep);}
  .thumb img{width:100%; height:100%; object-fit:cover; display:block;}
  .thumb .play{position:absolute; inset:0; display:flex; align-items:center; justify-content:center;}
  .thumb .play span{width:62px; height:62px; border-radius:50%; background:var(--orange); color:var(--ink); display:flex; align-items:center; justify-content:center; font-size:24px; box-shadow:0 6px 18px rgba(0,0,0,.3);}
  .thumb .dur{position:absolute; right:10px; bottom:10px; background:rgba(44,46,67,.92); color:#fff; font-size:13px; font-weight:700; padding:3px 8px; border-radius:6px;}
  .body{padding:14px 16px 16px; display:flex; flex-direction:column; gap:10px; flex:1;}
  .body h3{font-size:17.5px; line-height:1.35;}
  .links{display:flex; flex-wrap:wrap; gap:8px; margin-top:auto;}
  .links a{font-size:14px; font-weight:600; text-decoration:none; background:var(--cream); border:1px solid var(--line); border-radius:8px; padding:5px 10px;}
  .links a:hover{border-color:var(--orange);}
  footer{margin-top:44px; padding:22px 0 34px; color:var(--muted); font-size:13.5px; border-top:1px solid var(--line);}
  @media (max-width:900px){ .wrap{padding:0 16px;} .head h1{font-size:32px;} }
</style>
</head>
<body>
<header id="siteNav" data-page="videos"></header>
<main class="wrap">
  <div class="head">
    <div>
      <span class="label" id="trackLabel"></span>
      <h1>Videos</h1>
      <p id="intro"></p>
    </div>
    <a class="btn primary" id="playlist" target="_blank" rel="noopener">▶ Open the playlist on YouTube</a>
  </div>
  <div id="sections"></div>
  <footer>Independent study material. Not affiliated with, endorsed by, or approved by Anthropic. Videos play on YouTube.</footer>
</main>
<script src="site-nav.js"></script>
<script src="path-data.js"></script>
<script>
const PATHS = window.PATH_DATA;
const $ = id => document.getElementById(id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if(cls) e.className = cls; if(text !== undefined) e.textContent = text; return e; };
let saved = null; try{ saved = JSON.parse(localStorage.getItem("fc-track")); }catch(e){}
const q = new URLSearchParams(location.search).get("track");
const track = PATHS[q] ? q : (PATHS[saved] ? saved : "ccdv-f");
try{ localStorage.setItem("fc-track", JSON.stringify(track)); }catch(e){}
const P = PATHS[track];
document.title = "Videos · " + track.toUpperCase();
$("trackLabel").textContent = track.toUpperCase() + " · " + P.name;
$("playlist").href = P.playlist;

const ytId = url => { const m = /youtu\.be\/([\w-]{11})|[?&]v=([\w-]{11})/.exec(url); return m ? (m[1] || m[2]) : null; };
let count = 0;
P.sections.forEach(sec => {
  const vids = [];
  sec.lessons.forEach(l => l.links.forEach(link => {
    const id = ytId(link[2]);
    if(id) vids.push({ id, lesson: l, label: link[1] });
  }));
  if(!vids.length) return;
  const h = el("h2", "", sec.title);
  h.append(el("small", "", vids.length + (vids.length > 1 ? " videos" : " video")));
  const grid = el("div", "grid");
  vids.forEach(v => {
    count++;
    const card = el("article", "card");
    const a = el("a", "thumb");
    a.href = "https://youtu.be/" + v.id; a.target = "_blank"; a.rel = "noopener";
    const img = el("img"); img.loading = "lazy"; img.alt = ""; img.src = "https://i.ytimg.com/vi/" + v.id + "/hqdefault.jpg";
    const play = el("span", "play"); play.append(el("span", "", "▶"));
    a.append(img, play);
    const dur = /\(([^)]*min[^)]*)\)/.exec(v.label);
    if(dur) a.append(el("span", "dur", dur[1]));
    const body = el("div", "body");
    const part = /part [AB]/i.exec(v.label);
    body.append(el("h3", "", v.lesson.title + (part ? " · " + part[0] : "")));
    const links = el("div", "links");
    v.lesson.links.filter(l => !ytId(l[2])).forEach(l => {
      const x = el("a", "", l[0] + " " + l[1]); x.href = l[2];
      if(/^https?:/.test(l[2])){ x.target = "_blank"; x.rel = "noopener"; }
      links.append(x);
    });
    body.append(links);
    card.append(a, body);
    grid.append(card);
  });
  $("sections").append(h, grid);
});
$("intro").textContent = count + " videos, in the order to watch them. Each one links to its study notes and, where there is one, its hands-on build.";
</script>
</body>
</html>
