<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Learn</title>
<meta name="description" content="Study notes for every skill in the CCAO-F and CCDV-F exam guides: lessons, exam traps and worked questions.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 120'%3E%3Cpolygon points='60,4 108,32 108,88 60,116 12,88 12,32' fill='%23EE9D44'/%3E%3Cpolygon points='60,22 92,41 92,79 60,98 28,79 28,41' fill='%232A3446'/%3E%3C/svg%3E">
<link rel="stylesheet" href="theme.css?v=20261103">
<style>
  *{box-sizing:border-box; margin:0; padding:0;}
  .wrap{max-width:var(--page-max); margin:0 auto; padding:0 var(--page-pad);}
  .label{display:block; font-size:13px; font-weight:800; letter-spacing:1px; text-transform:uppercase; color:var(--orange-ink); margin-bottom:6px;}

  /* page head */
  .app{padding:0;}
  .col{min-width:0; padding:0 var(--page-pad) 0 clamp(28px,3vw,56px); max-width:1640px;}
  .head{padding:30px 0 10px; display:grid; grid-template-columns:minmax(0,1fr) auto; gap:24px; align-items:end;}
  .head h1{font-size:44px; line-height:1.1; letter-spacing:-.4px; color:var(--slate-deep);}
  .head .intro{color:var(--muted); max-width:820px; margin-top:8px;}
  .progress{display:none; font-size:15px; font-weight:700; color:var(--muted); text-align:right; white-space:nowrap;}
  .progress i{display:block; width:220px; height:8px; border-radius:99px; background:var(--slate-soft); margin-top:6px; overflow:hidden;}
  .progress i b{display:block; height:100%; background:var(--orange); width:0;}
  .glance{display:flex; flex-wrap:wrap; gap:10px; margin-top:18px; align-items:stretch;}
  .glance .fact{background:var(--cream); border:1px solid var(--peach); border-radius:12px; padding:10px 16px; font-size:17px; line-height:1.4; color:var(--ink);}
  .glance .fact b{display:block; font-size:14px; letter-spacing:.9px; text-transform:uppercase; color:var(--orange-ink); margin-bottom:2px;}
  .glance a.fact{text-decoration:none; background:var(--card); font-weight:700; display:flex; align-items:center; gap:8px;}
  .glance a.fact:hover{border-color:var(--orange);}
  .note{font-size:14px; color:var(--muted); margin-top:10px;}

  /* three columns */
  .layout{display:grid; grid-template-columns:360px minmax(0,1fr); gap:0; align-items:start;}
  .layout>*{min-width:0;}
  .side{position:sticky; top:64px; height:calc(100vh - 64px); overflow:auto; background:var(--slate-deep); color:#E3E5EE; border-radius:0; padding:26px 20px 30px; box-shadow:inset -1px 0 0 rgba(255,255,255,.06); scrollbar-width:thin; scrollbar-color:#3A4558 transparent;}
  .side .ttl{font-family:var(--mono); font-size:14.5px; font-weight:700; letter-spacing:2px; text-transform:uppercase; color:var(--peach); margin:0 4px 10px;}
  .side .prog{margin:0 4px 22px;}
  .side .prog i{display:block; height:8px; border-radius:99px; background:#4A4D68; overflow:hidden;}
  .side .prog i b{display:block; height:100%; width:0; background:var(--orange); border-radius:99px; transition:width .3s ease;}
  .side .prog .row{display:flex; justify-content:space-between; font-family:var(--mono); font-size:15px; color:#C9CCDA; margin-top:8px;}
  .side ol{list-style:none;}
  .side .ov{display:block; padding:8px 6px; color:#fff; text-decoration:none; font-weight:600; border-radius:8px;}
  .side .ov:hover{background:rgba(255,255,255,.06);}
  .dom{border-radius:12px;}
  .dom + .dom{margin-top:4px;}
  .dom-h{display:grid; grid-template-columns:18px 38px 1fr 22px; gap:6px; align-items:start; width:100%; text-align:left; font:inherit; color:#fff; background:transparent; border:0; border-radius:10px; padding:9px 6px; cursor:pointer;}
  .dom-h:hover{background:rgba(255,255,255,.06);}
  .dom.cur > .dom-h{background:rgba(238,157,68,.12);}
  .dom-h .ck{color:var(--good-soft); font-weight:800; font-size:16px; padding-top:2px; visibility:hidden;}
  .dom.done .dom-h .ck{visibility:visible; color:#7FD3A0;}
  .dom-h .no{font-family:var(--mono); font-size:15.5px; color:#AFB2C6; padding-top:2px;}
  .dom.cur .dom-h .no{color:var(--orange);}
  .dom-h .nm{font-weight:700; font-size:18px; line-height:1.3;}
  .dom-h .nm small{display:block; font-weight:500; font-size:14.5px; color:#AFB2C6; margin-top:3px;}
  .dom.cur .dom-h .nm{color:var(--orange);}
  .dom-h .chev{color:#AFB2C6; font-size:15px; padding-top:3px; transition:transform .2s ease;}
  .dom.open .dom-h .chev{transform:rotate(180deg);}
  .skl{display:none; position:relative; margin:2px 0 10px 32px; padding-left:14px; border-left:2px solid #3A4558;}
  .dom.open .skl{display:block;}
  .skl a{position:relative; display:grid; grid-template-columns:34px 1fr 18px; gap:4px; align-items:start; padding:6px 8px; border-radius:8px; color:#C9CCDA; text-decoration:none; font-size:17px; font-weight:500; line-height:1.35;}
  .skl a::before{content:""; position:absolute; left:-16px; top:6px; bottom:6px; width:2px; border-radius:2px; background:transparent;}
  .skl a:hover{background:rgba(255,255,255,.06); color:#fff;}
  .skl a .no{font-family:var(--mono); font-size:15px; color:#AFB2C6; padding-top:1px;}
  .skl a .ck{color:#7FD3A0; font-weight:800; visibility:hidden;}
  .skl a.done .ck{visibility:visible;}
  .skl a.on{color:#fff; font-weight:700; background:rgba(255,255,255,.08);}
  .skl a.on::before{background:var(--orange);}
  .skl a.on .no{color:var(--orange);}
  @media (prefers-reduced-motion:reduce){ .side .prog i b, .dom-h .chev{transition:none;} }

  /* domain */
  .panel{margin-top:22px; opacity:1; transition:opacity .16s ease;}
  .panel.swap{opacity:0;}
  .dtop{display:grid; grid-template-columns:minmax(0,1fr) min(440px,30%); gap:28px; align-items:start;}
  .dtop.novid{grid-template-columns:1fr;}
  .watch{background:var(--slate-deep); border-radius:14px; padding:8px; box-shadow:var(--shadow);}
  .watch .frame{position:relative; aspect-ratio:16/9; border-radius:10px; overflow:hidden; background:#000;}
  .watch iframe{position:absolute; inset:0; width:100%; height:100%; border:0;}
  .watch .poster{all:unset; position:absolute; inset:0; cursor:pointer; display:block;}
  .watch .poster img{width:100%; height:100%; object-fit:cover; display:block;}
  .watch .poster span{position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:56px; height:56px; border-radius:50%; background:var(--orange); color:var(--ink); display:flex; align-items:center; justify-content:center; font-size:28px; box-shadow:0 8px 22px rgba(0,0,0,.35);}
  .watch .poster:focus-visible{outline:3px solid var(--orange); outline-offset:-3px;}
  .watch .cap{display:flex; flex-wrap:wrap; gap:8px; align-items:center; justify-content:space-between; color:#fff; font-size:14.5px; font-weight:700; padding:10px 4px 2px;}
  .watch .tabs{display:flex; gap:6px; flex-wrap:wrap;}
  .watch .tabs button{font:inherit; font-size:13.5px; font-weight:700; color:#fff; background:var(--slate); border:1px solid #3A4558; border-radius:8px; padding:4px 10px; cursor:pointer;}
  .watch .tabs button[aria-pressed="true"]{background:var(--orange); border-color:var(--orange); color:var(--ink);}
  .watch .cap a{color:var(--peach); font-weight:600;}
  .practice{margin-top:22px; background:var(--card); border:2px solid var(--slate); border-radius:18px; padding:20px 22px; box-shadow:var(--shadow);}
  .practice .ph{display:flex; flex-wrap:wrap; gap:10px 18px; align-items:baseline; justify-content:space-between;}
  .practice .ph h3{font-size:20px; color:var(--slate-deep);}
  .practice .ph a{font-weight:700; color:var(--orange-ink);}
  .practice .ph p{flex-basis:100%; color:var(--muted); font-size:15.5px;}
  .eps{display:grid; grid-template-columns:repeat(auto-fit,minmax(340px,1fr)); gap:16px; margin-top:14px;}
  .ep{display:flex; flex-direction:column; gap:10px; background:var(--paper); border:1px solid var(--line); border-radius:14px; padding:16px;}
  .ep .top{display:flex; flex-wrap:wrap; gap:8px; align-items:center;}
  .ep .top b{font-size:17px; color:var(--slate-deep);}
  .ep .tag{font-size:12px; font-weight:800; letter-spacing:.6px; text-transform:uppercase; border-radius:999px; padding:2px 9px; background:var(--slate-soft); color:var(--slate);}
  .ep .tag.free{background:var(--good-soft); color:var(--good);}
  .ep .tag.key{background:var(--cream); color:var(--orange-ink);}
  .ep .what{font-size:15.5px;}
  .ep ul{list-style:none; display:grid; gap:4px; font-size:14.5px;}
  .ep ul code{font-family:var(--mono); font-size:13.5px; background:var(--cream); border-radius:5px; padding:1px 6px; margin-right:6px;}
  .ep pre{margin:0; background:var(--slate-deep); color:#F4EFE6; border-radius:10px; padding:10px 12px; font-family:var(--mono); font-size:13.5px; line-height:1.55; overflow-x:auto; white-space:pre;}
  .ep .acts{display:flex; flex-wrap:wrap; gap:8px; margin-top:auto;}
  .ep .acts a{font-size:14.5px; font-weight:700; text-decoration:none; border-radius:9px; padding:7px 12px; border:1px solid var(--line); background:var(--card);}
  .ep .acts a.go{background:var(--slate); border-color:var(--slate); color:#fff;}
  .ep .acts a:hover{border-color:var(--orange);}
  @media (min-width:1700px){ .panel .hl ul{grid-template-columns:repeat(4,minmax(0,1fr));} }
  .dhead h2{font-size:36px; line-height:1.15; color:var(--slate-deep); display:flex; flex-wrap:wrap; gap:14px; align-items:baseline;}
  .weight{font-size:15px; font-weight:800; background:var(--orange); color:var(--ink); border-radius:999px; padding:3px 12px; letter-spacing:.3px;}
  .weight.sm{font-size:13px; padding:2px 10px; background:var(--peach);}
  .dhead p{color:#3b3e55; margin-top:8px; max-width:900px;}
  .chips{display:flex; flex-wrap:wrap; gap:8px; margin-top:14px;}
  .chip{display:inline-flex; align-items:center; gap:6px; font-size:14.5px; font-weight:600; text-decoration:none; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:5px 10px; white-space:nowrap;}
  a.chip:hover{border-color:var(--orange); background:var(--cream);}

  .hl{margin-top:22px; background:var(--cream); border:1px solid var(--peach); border-radius:var(--radius); padding:18px 22px;}
  .hl h3{font-size:17px; margin-bottom:10px; color:var(--slate-deep);}
  .hl ul{list-style:none; display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px 24px;}
  .hl li{display:flex; gap:10px;}
  .hl li::before{content:"★"; color:var(--orange-ink); font-weight:800;}


  .sub{margin-top:26px; background:var(--card); border:1px solid var(--line); border-radius:18px; padding:26px 30px; box-shadow:var(--shadow); scroll-margin-top:84px;}
  .sub h3{font-size:25px; line-height:1.25; display:flex; flex-wrap:wrap; gap:12px; align-items:baseline; color:var(--slate-deep);}
  .sub h3 .num{font-size:15px; font-weight:800; color:var(--orange-ink);}
  .scope{margin-top:10px; font-size:15.5px; color:var(--muted); border-left:3px solid var(--peach); padding:4px 0 4px 12px;}
  .scope b{color:var(--ink);}
  .sub h4{font-size:13px; font-weight:800; letter-spacing:1px; text-transform:uppercase; color:var(--muted); margin:22px 0 10px;}
  .subgrid{display:grid; grid-template-columns:minmax(0,1fr); gap:0 40px; margin-top:4px;}
  .subgrid>*{min-width:0;}
  .sg-side .short{margin-top:14px;}
  @media (min-width:1500px){
    .subgrid{grid-template-columns:minmax(0,1fr) minmax(340px,38%); grid-template-areas:"main side";}
    .sg-main{grid-area:main;} .sg-side{grid-area:side; align-self:start;}
    .sg-side .terms{grid-template-columns:1fr;}
    .sg-side{background:var(--paper); border:1px solid var(--line); border-radius:14px; padding:4px 18px 18px; margin-top:14px;}
  }
  .short{margin-top:14px; background:var(--cream); border-left:4px solid var(--orange); border-radius:0 12px 12px 0; padding:12px 16px; font-size:1.02em; max-width:92ch;}
  .short b{display:block; font-size:12.5px; letter-spacing:1px; text-transform:uppercase; color:var(--orange-ink); margin-bottom:2px;}
  .terms{display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:10px; margin-top:2px;}
  .terms div{background:var(--paper); border:1px solid var(--line); border-radius:10px; padding:10px 12px; font-size:15.5px; line-height:1.5;}
  .terms dt{font-family:var(--mono); font-weight:700; font-size:14.5px; color:var(--slate-deep); margin-bottom:3px;}
  .terms dd{margin:0; color:#3B3E55;}
  .lesson p{margin-top:12px; max-width:92ch;}
  .lesson p:first-child{margin-top:0;}

  .tbl{margin-top:16px; overflow-x:auto; border:1px solid var(--line); border-radius:12px;}
  .tbl table{width:100%; border-collapse:collapse; font-size:15.5px; line-height:1.45;}
  .tbl caption{caption-side:top; text-align:left; font-weight:800; font-size:14.5px; padding:10px 14px; background:var(--cream); color:var(--slate-deep);}
  .tbl th{background:var(--slate); color:#fff; text-align:left; padding:9px 14px; font-size:14px; font-weight:700;}
  .tbl td{padding:9px 14px; border-top:1px solid var(--line); vertical-align:top;}
  .tbl tr:nth-child(even) td{background:#FFFCF5;}
  .tbl td:first-child{font-weight:600;}

  .code{margin-top:16px; border-radius:12px; overflow:hidden; border:1px solid #2a2c3f;}
  .code .cap{background:var(--slate); color:#fff; font-size:13.5px; font-weight:700; padding:7px 14px;}
  .code pre{margin:0; background:var(--slate-deep); color:#F4EFE6; padding:14px; font-family:var(--mono); font-size:14.5px; line-height:1.55; overflow-x:auto; white-space:pre;}

  .know{list-style:none; display:grid; gap:9px;}
  .know li{position:relative; padding-left:24px;}
  .know li::before{content:""; position:absolute; left:5px; top:.66em; width:9px; height:9px; border-radius:50%; background:var(--orange);}

  .build{display:inline-flex; align-items:center; gap:8px; margin-top:16px; font-weight:700; font-size:15.5px; text-decoration:none; background:var(--slate); color:#fff; border-radius:10px; padding:9px 14px;}
  .build:hover{background:var(--slate-deep);}

  .traps{display:grid; grid-template-columns:minmax(0,1fr); gap:14px;}
  .trap{position:relative; display:grid; grid-template-columns:minmax(0,5fr) minmax(0,7fr); gap:10px 36px; align-items:start; background:var(--slate); color:#EEF0F6; border-left:5px solid var(--orange); border-radius:14px; padding:20px 26px; overflow:hidden;}
  .trap .tl{grid-column:1/-1; display:flex; align-items:center; gap:8px; font-family:var(--mono); font-size:13px; font-weight:700; letter-spacing:1.4px; color:var(--peach);}
  .trap .mv{font-weight:700; color:#fff; font-size:19px; line-height:1.45;}
  .trap .why{color:#E3E6EF; font-size:17.5px; line-height:1.6; padding-left:24px; border-left:1px solid rgba(255,255,255,.14);}
  .trap .why b{display:block; font-family:var(--mono); font-size:12px; font-weight:700; letter-spacing:1.2px; color:var(--peach); margin-bottom:4px;}

  .rem{margin-top:26px; background:var(--cream); border:2px dashed var(--peach); border-radius:var(--radius); padding:18px 22px;}
  .rem h3{font-size:17px; margin-bottom:8px;}
  .rem ol{padding-left:22px; display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:6px 24px; font-weight:600;}

  .subfoot{display:flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:flex-end; margin-top:20px; padding-top:16px; border-top:1px solid var(--line);}
  .subfoot .hint{margin-right:auto; color:var(--muted); font-size:14.5px;}
  .wq{margin-top:20px; background:var(--cream); border:1px solid var(--peach); border-radius:14px; padding:18px 20px;}
  .wq h4{margin:0 0 8px!important;}
  .wq .t{font-weight:800; color:var(--slate-deep); font-size:17px;}
  .wq .stem p{margin:8px 0; max-width:82ch;}
  .wq .opts{display:grid; gap:8px; margin-top:12px;}
  .wq .opt{display:grid; grid-template-columns:34px 1fr; gap:10px; align-items:start; text-align:left; font:inherit; font-size:16px; background:var(--card); color:var(--ink); border:2px solid var(--line); border-radius:12px; padding:10px 12px; cursor:pointer;}
  .wq .opt:hover:not(:disabled){border-color:var(--orange);}
  .wq .opt b{display:flex; align-items:center; justify-content:center; width:30px; height:30px; border-radius:50%; background:var(--slate-soft); font-weight:800;}
  .wq .opt.right{border-color:var(--good); background:var(--good-soft);}
  .wq .opt.right b{background:var(--good); color:#fff;}
  .wq .opt.wrong{border-color:var(--bad); background:var(--bad-soft);}
  .wq .opt.wrong b{background:var(--bad); color:#fff;}
  .wq .opt:disabled{cursor:default;}
  .wq .verdict{margin-top:12px; font-weight:800;}
  .wq .verdict.ok{color:var(--good);} .wq .verdict.no{color:var(--bad);}
  .wq .reveal{margin-top:8px; background:var(--card); border-radius:10px; padding:10px 16px; border-left:4px solid var(--orange);}
  .wq .reveal p{margin:6px 0;}
  .wq .more{margin-top:10px; font-size:14.5px;}
  .wq .more a{color:var(--orange-ink); font-weight:700;}
  .crumb{display:inline-block; margin-top:22px; font-weight:700; font-size:15.5px; color:var(--orange-ink); text-decoration:none;}
  .crumb:hover{text-decoration:underline;}
  .pager{display:flex; flex-wrap:wrap; gap:12px; align-items:stretch; margin-top:26px; padding-top:18px; border-top:1px solid var(--line);}
  .pager .sp{flex:1;}
  .pager a.btn{flex-direction:column; align-items:flex-start; gap:2px; max-width:440px; line-height:1.3;}
  .pager a.btn small{font-size:12.5px; font-weight:800; letter-spacing:.8px; text-transform:uppercase; opacity:.75;}
  .pager a.btn span{font-size:16.5px;}
  .pager a.btn.primary{align-items:flex-end; text-align:right;}
  .pager button.btn{align-self:center;}
  .skillcards{margin-top:24px;}
  .skillcards h3{font-size:20px; color:var(--slate-deep); margin-bottom:12px;}
  .sc-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(340px,1fr)); gap:14px;}
  .sc{display:flex; flex-direction:column; gap:8px; background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px 18px; text-decoration:none; color:var(--ink); box-shadow:var(--shadow); transition:border-color .15s ease, transform .15s ease;}
  .sc:hover{border-color:var(--orange); transform:translateY(-2px);}
  .sc-t{display:grid; grid-template-columns:auto 1fr auto; gap:10px; align-items:baseline;}
  .sc-t .num{font-family:var(--mono); font-weight:800; font-size:14px; color:var(--orange-ink);}
  .sc-t b{font-size:18.5px; color:var(--slate-deep); line-height:1.3;}
  .sc-t .ck{color:var(--good); font-weight:800; visibility:hidden;}
  .sc.done .sc-t .ck{visibility:visible;}
  .sc p{font-size:16px; color:#3B3E55; line-height:1.5;}
  .sc .meta{margin-top:auto; font-size:13.5px; color:var(--muted); font-weight:600;}
  @media (prefers-reduced-motion:reduce){ .sc{transition:none;} .sc:hover{transform:none;} }
  .foot{display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-top:26px;}
  .btn{font:inherit; font-size:16px; font-weight:700; border:2px solid var(--line); background:var(--card); color:var(--ink); border-radius:10px; padding:10px 16px; cursor:pointer; text-decoration:none; display:inline-flex; align-items:center; gap:8px;}
  .btn:hover{border-color:var(--orange);}
  .btn.primary{background:var(--orange); border-color:var(--orange); color:var(--ink);}
  .btn.done{background:var(--good-soft); border-color:#B9DCC6; color:var(--good);}
  .foot .sp{flex:1;}
  .empty{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:24px;}

  .tip{margin-top:34px; background:var(--cream); border:2px solid var(--peach); border-radius:var(--radius); padding:16px 18px; display:flex; flex-wrap:wrap; gap:12px; align-items:center;}
  .tip p{flex:1 1 320px; font-size:15.5px;}
  .btn.coffee{background:var(--slate); border-color:var(--slate); color:#fff;}
  footer{margin-top:40px; padding:22px 0 34px; color:var(--muted); font-size:13.5px; border-top:1px solid var(--line);}
  .hidden{display:none!important;}

  @media (prefers-reduced-motion:reduce){ .panel{transition:none;} }
  @media (max-width:1240px){
    .layout{grid-template-columns:300px minmax(0,1fr);}
  }
  @media (max-width:900px){
    .wrap{padding:0 16px;}
    .col{padding:0 16px;}
    .head{grid-template-columns:1fr;}
    .progress{text-align:left;}
    .head h1{font-size:32px;}
    .layout{grid-template-columns:1fr;}
    .side{position:static; height:auto; max-height:none; padding:16px 14px;}
    .layout{display:block;}
    .dhead h2{font-size:27px;}
    .hl ul, .traps, .rem ol{grid-template-columns:1fr;}
    .trap{grid-template-columns:minmax(0,1fr); padding:16px 18px;} .trap .why{padding-left:0; border-left:0;}
    .dtop{grid-template-columns:1fr;}
    .sub{padding:18px 16px;}
    .sub h3{font-size:21px;}
  }
  @media print{
    nav.sn,.side,.toc,.foot,.tip,.glance{display:none!important;}
    .layout{display:block;}
    .trap{background:#fff; color:#000; border:1px solid #999; border-left:4px solid #000;}
    .trap .mv{color:#000;} .trap .why{color:#333;} .trap .tl{color:#000;}
    .sub{break-inside:avoid-page; box-shadow:none;}
  }
</style>

      <footer>Independent study material. Not affiliated with, endorsed by or approved by Anthropic. Not a certification, score or prediction.</footer>
    </div>
  </div>
</main>

<script src="site-nav.js?v=20261103"></script>
<script src="md-view.js?v=20261103"></script>
<script src="learn-data-ccao-f.js?v=20261103"></script>
<script src="learn-data-ccdv-f.js?v=20261103"></script>
<script>
const DATA = window.LEARN_DATA || {};
const $ = id => document.getElementById(id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if(cls) e.className = cls; if(text !== undefined) e.textContent = text; return e; };
function load(key, fallback){ try{ const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }catch(e){ return fallback; } }
function save(key, val){ try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){} }
const reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

const params = new URLSearchParams(location.search);
const wanted = params.get("track") || load("fc-track", "ccdv-f");
const track = DATA[wanted] ? wanted : (DATA["ccdv-f"] ? "ccdv-f" : Object.keys(DATA)[0]);
save("fc-track", track);
const T = DATA[track];
const READ_KEY = "learn-read-" + track, DONE_KEY = "learn-done-" + track;
let read = load(READ_KEY, []);
if(!Array.isArray(read)) read = [];
let done = load(DONE_KEY, null);
const skillIds = d => d.subs.map((_, i) => d.id + "-" + (i + 1));
if(!Array.isArray(done)){
  // first visit with per-skill progress: carry over domains marked read before
  done = [];
  if(T) T.domains.filter(d => read.includes(d.id)).forEach(d => done.push(...skillIds(d)));
  save(DONE_KEY, done);
}
const domainDone = d => skillIds(d).every(id => done.includes(id));
const open = new Set();

const ytId = url => { const m = /youtu\.be\/([\w-]{11})|[?&]v=([\w-]{11})/.exec(url || ""); return m ? (m[1] || m[2]) : null; };
/* The player loads only when the learner presses play (privacy-enhanced embed, no YouTube request before that). */
function watchPanel(vids){
  const box = el("div", "watch"), frame = el("div", "frame"), cap = el("div", "cap");
  let cur = 0;
  function poster(){
    frame.replaceChildren();
    const b = el("button", "poster"); b.type = "button"; b.setAttribute("aria-label", "Play: " + vids[cur].label);
    const img = el("img"); img.alt = ""; img.src = "https://i.ytimg.com/vi/" + vids[cur].id + "/hqdefault.jpg";
    b.append(img, el("span", "", "\u25B6"));
    b.addEventListener("click", () => {
      const f = el("iframe");
      f.src = "https://www.youtube-nocookie.com/embed/" + vids[cur].id + "?autoplay=1&rel=0";
      f.title = vids[cur].label; f.allow = "autoplay; encrypted-media; picture-in-picture; fullscreen"; f.allowFullscreen = true;
      frame.replaceChildren(f);
    });
    frame.append(b);
    title.textContent = vids[cur].label.replace(/^Watch\s*/, "");
    link.href = "https://youtu.be/" + vids[cur].id;
    tabs.querySelectorAll("button").forEach((x, j) => x.setAttribute("aria-pressed", String(j === cur)));
  }
  const title = el("span"), link = el("a", "", "YouTube \u2197"); link.target = "_blank"; link.rel = "noopener";
  const tabs = el("div", "tabs");
  if(vids.length > 1) vids.forEach((v, j) => { const b = el("button", "", "Video " + (j + 1)); b.type = "button"; b.addEventListener("click", () => { cur = j; poster(); }); tabs.append(b); });
  cap.append(title, tabs, link);
  box.append(frame, cap);
  poster();
  return box;
}

function chip(icon, label, url, cls){
  const a = el("a", cls || "chip");
  a.href = url;
  if(/^https?:/.test(url)){ a.target = "_blank"; a.rel = "noopener"; }
  a.append(el("span", "", icon), el("span", "", label));
  return a;
}
const pct = w => (w === null || w === undefined) ? "" : String(w) + "%";

if(!T){
  $("panel").append(el("div", "empty", "Notes for this certification are coming."));
} else {
  document.title = "Learn · " + track.toUpperCase();
  $("trackLabel").textContent = track.toUpperCase() + " · " + T.name;
  $("intro").textContent = T.intro;
  $("asof").textContent = "Facts checked " + T.asOf + ". Confirm at docs.claude.com.";
  const g = $("glance");
  (T.glance || []).forEach(([k, v]) => { const f = el("div", "fact"); f.append(el("b", "", k), document.createTextNode(v)); g.append(f); });
  if(T.guide) g.append(chip(T.guide[0], T.guide[1], T.guide[2], "fact"));
  (T.overview || []).filter(l => !ytId(l[2])).forEach(l => g.append(chip(l[0], l[1], l[2], "fact")));   // videos live on the Videos page

  function drawNav(current, curSkill){
    const ol = $("nav"); ol.replaceChildren();
    open.add(current);
    T.domains.forEach(d => {
      const li = el("li", "dom" + (d.id === current ? " cur" : "") + (open.has(d.id) ? " open" : "") + (domainDone(d) ? " done" : ""));
      const h = el("button", "dom-h"); h.type = "button";
      h.setAttribute("aria-expanded", String(open.has(d.id)));
      const nm = el("span", "nm", d.title);
      nm.append(el("small", "", (d.w ? pct(d.w) + " of the exam · " : "") + d.subs.length + (d.subs.length > 1 ? " skills" : " skill")));
      h.append(el("span", "ck", "✓"), el("span", "no", d.code === "★" ? "★" : "0" + d.code.slice(1)), nm, el("span", "chev", "▾"));
      h.addEventListener("click", () => {
        if(d.id !== current || curSkill){ location.hash = d.id; return; }
        open.has(d.id) ? open.delete(d.id) : open.add(d.id);
        li.classList.toggle("open"); h.setAttribute("aria-expanded", String(open.has(d.id)));
      });
      const sk = el("ol", "skl");
      d.subs.forEach((sub, i) => {
        const sid = d.id + "-" + (i + 1);
        const a = el("a" , (done.includes(sid) ? "done" : "") + (sid === curSkill ? " on" : ""));
        a.href = "#" + sid; a.dataset.sid = sid;
        a.append(el("span", "no", (d.code === "★" ? "" : d.code.slice(1) + ".") + (i + 1)), el("span", "", sub.title), el("span", "ck", "✓"));
        const sli = el("li"); sli.append(a); sk.append(sli);
      });
      li.append(h, sk); ol.append(li);
    });
    const all = T.domains.reduce((n, d) => n + d.subs.length, 0);
    const n = T.domains.reduce((m, d) => m + skillIds(d).filter(id => done.includes(id)).length, 0);
    const p = Math.round(n / all * 100);
    $("sideText").textContent = n + " of " + all + " skills";
    $("sidePct").textContent = p + "%";
    $("sideBar").style.width = p + "%";
    $("progText").textContent = n + " of " + all + " skills done";
    $("progBar").style.width = p + "%";
  }

  function toggleSkill(sid, on){
    done = on ? (done.includes(sid) ? done : done.concat(sid)) : done.filter(x => x !== sid);
    save(DONE_KEY, done);
  }

  /* Worked questions: answer on the page; the question text lives in the repo's own Markdown file. */
  const wqCache = {};
  function workedQuestion(url){
    const m = /read\.html\?doc=([^#]+)#(.+)$/.exec(url);
    if(!m) return null;
    const [, docPath, qid] = m;
    const box = el("div", "wq");
    box.append(el("h4", "", "Worked question"));
    const body = el("div"); body.append(el("p", "", "Loading the question…"));
    box.append(body);
    (wqCache[docPath] = wqCache[docPath] || fetch(docPath).then(r => r.ok ? r.text() : Promise.reject()).then(MD.questions)).then(Q => {
      const q = Q[qid]; body.replaceChildren();
      if(!q || !q.options.length){ const a = el("a", "", "Open the worked question →"); a.href = url; body.append(a); return; }
      body.append(el("div", "t", q.title));
      const stem = el("div", "stem"); stem.append(MD.render(q.stem, docPath)); body.append(stem);
      const opts = el("div", "opts"), verdict = el("div", "verdict"), reveal = el("div", "reveal");
      reveal.hidden = true;
      q.options.forEach(([L, txt]) => {
        const b = el("button", "opt"); b.type = "button";
        const tx = el("span"); tx.append(MD.inline(txt, docPath));
        b.append(el("b", "", L), tx);
        b.addEventListener("click", () => {
          opts.querySelectorAll("button").forEach(x => { x.disabled = true; if(x.firstChild.textContent === q.answer) x.classList.add("right"); });
          if(L !== q.answer) b.classList.add("wrong");
          verdict.textContent = L === q.answer ? "✓ Right." : "✗ Not quite: the answer is " + q.answer + ".";
          verdict.className = "verdict " + (L === q.answer ? "ok" : "no");
          reveal.hidden = false;
        });
        opts.append(b);
      });
      reveal.append(MD.render(q.reveal, docPath));
      const more = el("p", "more"); const a = el("a", "", "All worked questions →"); a.href = "read.html?doc=" + docPath; more.append(a);
      body.append(opts, verdict, reveal, more);
    }).catch(() => { body.replaceChildren(); const a = el("a", "", "Open the worked question →"); a.href = url; body.append(a); });
    return box;
  }

  function jump(id){
    const go = () => { const t = document.getElementById(id); if(t) t.scrollIntoView({behavior: "auto", block: "start"}); };
    go();
    // worked questions above the target load a moment later and change the page height: re-align until they settle
    if("ResizeObserver" in window){
      const panel = $("panel"), ro = new ResizeObserver(go);
      ro.observe(panel);
      const stop = () => { ro.disconnect(); window.removeEventListener("wheel", stop); window.removeEventListener("touchstart", stop); window.removeEventListener("keydown", stop); };
      window.addEventListener("wheel", stop, {passive: true}); window.addEventListener("touchstart", stop, {passive: true}); window.addEventListener("keydown", stop);
      setTimeout(stop, 1500);
    } else setTimeout(go, 700);
  }

  /* Pages in reading order: each domain's overview, then its skills one per page. */
  const PAGES_SEQ = [];
  T.domains.forEach(d => { PAGES_SEQ.push({ d, si: null }); d.subs.forEach((_, i) => PAGES_SEQ.push({ d, si: i })); });
  const pageId = pg => pg.si === null ? pg.d.id : pg.d.id + "-" + (pg.si + 1);
  const pageLabel = pg => pg.si === null ? (pg.d.code === "\u2605" ? "" : pg.d.code + " \u00b7 ") + pg.d.title + " overview"
    : (pg.d.code === "\u2605" ? "" : pg.d.code + "." + (pg.si + 1) + " ") + pg.d.subs[pg.si].title;

  function renderSkill(d, s, i, firstWQ){
    const isT = d.code === "\u2605";
    const sid = d.id + "-" + (i + 1);
    const sec = el("section", "sub");
    sec.id = sid;
    const h3 = el("h3");
    h3.append(el("span", "num", (isT ? "" : d.code + ".") + (i + 1)), el("span", "", s.title));
    if(s.w) h3.append(el("span", "weight sm", pct(s.w)));
    sec.append(h3);
    if(s.scope){ const sc = el("p", "scope"); sc.append(el("b", "", "Exam guide covers: "), document.createTextNode(s.scope)); sec.append(sc); }

    const grid = el("div", "subgrid"), main = el("div", "sg-main"), side = el("aside", "sg-side");
    grid.append(side, main); sec.append(grid);
    if(s.short){ const sh = el("p", "short"); sh.append(el("b", "", "In short"), document.createTextNode(s.short)); side.append(sh); }
    if(s.terms && s.terms.length){
      side.append(el("h4", "", "Key terms"));
      const dl = el("dl", "terms");
      s.terms.forEach(([t, d]) => { const box = el("div"); box.append(el("dt", "", t), el("dd", "", d)); dl.append(box); });
      side.append(dl);
    }
    if(s.lesson && s.lesson.length){
      main.append(el("h4", "", "The lesson"));
      const ls = el("div", "lesson");
      s.lesson.forEach(t => ls.append(el("p", "", t)));
      main.append(ls);
    }
    (s.tables || []).forEach(t => {
      const wrap = el("div", "tbl"), table = el("table");
      table.append(el("caption", "", t.cap));
      const thead = el("thead"), hr = el("tr");
      t.h.forEach(h => hr.append(el("th", "", h)));
      thead.append(hr);
      const tb = el("tbody");
      t.r.forEach(row => { const tr = el("tr"); row.forEach(c => tr.append(el("td", "", c))); tb.append(tr); });
      table.append(thead, tb); wrap.append(table); main.append(wrap);
    });
    if(s.code){
      const c = el("div", "code");
      c.append(el("div", "cap", s.code.cap), el("pre", "", s.code.text));
      main.append(c);
    }
    if(s.know && s.know.length){
      side.append(el("h4", "", "What you need to know"));
      const k = el("ul", "know");
      s.know.forEach(t => k.append(el("li", "", t)));
      side.append(k);
    }
    if(s.build){
      const isWQ = /episode-questions\.md#/.test(s.build[1]);
      // a worked question shared by several skills appears once, on the first of them; the others show nothing
      const first = isWQ && firstWQ ? firstWQ[s.build[1]] : null;
      if(!first || first.sid === d.id + "-" + (i + 1)){
        const wq = isWQ ? workedQuestion(s.build[1]) : null;
        sec.append(wq || chip("\u2328", s.build[0] + " \u2192", s.build[1], "build"));
      }
    }
    if(s.traps && s.traps.length){
      sec.append(el("h4", "", s.traps.length > 1 ? "Exam traps (" + s.traps.length + ")" : "Exam trap"));
      const grid = el("div", "traps");
      s.traps.forEach(t => {
        const box = el("div", "trap");
        const why = el("div", "why"); why.append(el("b", "", "WHY IT FAILS"), document.createTextNode(t.why));
        box.append(el("div", "tl", "⚠ EXAM TRAP"), el("div", "mv", "“" + t.move + "”"), why);
        grid.append(box);
      });
      sec.append(grid);
    }
    return sec;
  }

  function drawDomain(d, si){
    const p = $("panel"); p.replaceChildren();
    const idx = T.domains.indexOf(d);
    const isT = d.code === "\u2605";
    const firstWQ = {};
    d.subs.forEach((x, i) => { if(x.build && /episode-questions\.md#/.test(x.build[1]) && !firstWQ[x.build[1]]) firstWQ[x.build[1]] = { sid: d.id + "-" + (i + 1), label: (isT ? "" : d.code + ".") + (i + 1) }; });
    const here = PAGES_SEQ.findIndex(pg => pg.d === d && pg.si === si);
    const prev = PAGES_SEQ[here - 1], next = PAGES_SEQ[here + 1];

    function pager(withDone){
      const nav = el("nav", "pager"); nav.setAttribute("aria-label", "Previous and next");
      if(prev){ const a = el("a", "btn"); a.href = "#" + pageId(prev); a.append(el("small", "", "Previous"), el("span", "", "\u2190 " + pageLabel(prev))); nav.append(a); }
      nav.append(el("span", "sp"));
      if(withDone){
        const sid = d.id + "-" + (si + 1);
        const mk = el("button", "btn"); mk.type = "button";
        const setMk = () => { const on = done.includes(sid); mk.textContent = on ? "\u2713 Done" : "Mark as done"; mk.className = "btn" + (on ? " done" : ""); };
        setMk();
        mk.addEventListener("click", () => { toggleSkill(sid, !done.includes(sid)); setMk(); drawNav(d.id, sid); });
        nav.append(mk);
      }
      if(next){
        const a = el("a", "btn primary"); a.href = "#" + pageId(next);
        a.append(el("small", "", withDone ? "Done? Next" : "Next"), el("span", "", pageLabel(next) + " \u2192"));
        if(withDone) a.addEventListener("click", () => toggleSkill(d.id + "-" + (si + 1), true));
        nav.append(a);
      } else { const a = el("a", "btn primary"); a.href = T.exam; a.append(el("small", "", "Finished"), el("span", "", "Sit the mock exam \u2192")); nav.append(a); }
      return nav;
    }

    if(si !== null){
      // ---- one skill per page ----
      const crumb = el("a", "crumb", "\u2190 " + (isT ? "" : "Domain " + d.code.slice(1) + " \u00b7 ") + d.title + (d.w ? " \u00b7 " + pct(d.w) + " of the exam" : ""));
      crumb.href = "#" + d.id;
      p.append(crumb, renderSkill(d, d.subs[si], si, firstWQ), pager(true));
      return;
    }

    // ---- domain overview ----
    const head = el("header", "dhead");
    head.append(el("span", "label", (isT ? "" : "Domain " + d.code.slice(1) + " \u00b7 ") + d.eps));
    const h2 = el("h2", "", d.title);
    if(d.w) h2.append(el("span", "weight", pct(d.w) + " of the exam"));
    head.append(h2, el("p", "", d.summary));
    const chips = el("div", "chips");
    // no chips for what is already on the page: videos (panel beside), builds (practice panel), worked questions (on the skill pages), the mock exam (header)
    d.links.filter(l => !ytId(l[2]) && !/episode-questions\.md#/.test(l[2]) && !(d.practice && d.practice.length && l[0] === "\u2328")).forEach(l => chips.append(chip(...l)));
    chips.append(chip("🃏", "Flashcards for this domain", T.flash + "&topic=" + d.t));
    head.append(chips);
    const vids = d.links.map(l => ({ id: ytId(l[2]), label: l[1] })).filter(v => v.id);
    const top = el("div", "dtop" + (vids.length ? "" : " novid"));
    top.append(head);
    if(vids.length) top.append(watchPanel(vids));
    p.append(top);

    const hl = el("section", "hl");
    hl.append(el("h3", "", "Key exam highlights"));
    const ul = el("ul");
    d.highlights.forEach(h => ul.append(el("li", "", h)));
    hl.append(ul); p.append(hl);

    // the skills in this domain, one card each; each opens its own page
    const sk = el("section", "skillcards");
    sk.append(el("h3", "", (d.subs.length > 1 ? d.subs.length + " skills" : "1 skill") + " in this domain"));
    const grid = el("div", "sc-grid");
    d.subs.forEach((x, i) => {
      const sid = d.id + "-" + (i + 1);
      const a = el("a", "sc" + (done.includes(sid) ? " done" : "")); a.href = "#" + sid;
      const t = el("div", "sc-t");
      t.append(el("span", "num", (isT ? "" : d.code + ".") + (i + 1)), el("b", "", x.title), el("span", "ck", "\u2713"));
      a.append(t, el("p", "", x.short || x.scope || ""));
      const meta = [x.traps && x.traps.length ? x.traps.length + " traps" : null, x.terms && x.terms.length ? x.terms.length + " key terms" : null, x.w ? pct(x.w) + " of the exam" : null].filter(Boolean).join(" \u00b7 ");
      if(meta) a.append(el("span", "meta", meta));
      grid.append(a);
    });
    sk.append(grid); p.append(sk);

    if(d.practice && d.practice.length){
      const pr = el("section", "practice");
      const ph = el("div", "ph");
      ph.append(el("h3", "", "\u2328 Practise it: hands-on builds"));
      const repo = el("a", "", "chittychat-studio/ccdvf-course \u2197"); repo.href = T.practiceRepo; repo.target = "_blank"; repo.rel = "noopener";
      ph.append(repo, el("p", "", "Code from each episode: clone it, run it, break it. Some folders add a PRACTICE.md."));
      pr.append(ph);
      const eps = el("div", "eps");
      d.practice.forEach(e => {
        const base = T.practiceRepo + "/tree/main/" + e.dir, blob = T.practiceRepo + "/blob/main/" + e.dir;
        const card = el("article", "ep");
        const top = el("div", "top");
        top.append(el("b", "", e.ep + " \u00b7 " + e.dir), el("span", "tag", e.lang), el("span", "tag " + (e.key ? "key" : "free"), e.key ? "Needs an API key" : "No API key needed"));
        card.append(top, el("p", "what", e.what));
        const ul = el("ul");
        e.files.forEach(([f, t]) => { const li = el("li"); li.append(el("code", "", f), document.createTextNode(t)); ul.append(li); });
        card.append(ul, el("pre", "", e.run));
        const acts = el("div", "acts");
        const add = (label, href, cls) => { const a = el("a", cls || "", label); a.href = href; a.target = "_blank"; a.rel = "noopener"; acts.append(a); };
        add("Open the folder \u2197", base, "go");
        add("README", blob + "/README.md");
        if(e.practice) add("PRACTICE.md", blob + "/PRACTICE.md");
        card.append(acts);
        eps.append(card);
      });
      pr.append(eps);
      p.append(pr);
    }


    const rem = el("section", "rem");
    rem.append(el("h3", "", "Remember"));
    const ol = el("ol");
    d.remember.forEach(r => ol.append(el("li", "", r)));
    rem.append(ol); p.append(rem);
    p.append(pager(false));
  }

  function route(scroll){
    const id = location.hash.slice(1);
    if(id === "top"){ window.scrollTo({top: 0, behavior: reduceMotion ? "auto" : "smooth"}); return; }
    const dm = /^([a-z]+\d*)(?:-(\d+))?$/.exec(id);
    const d = (dm && T.domains.find(x => x.id === dm[1])) || T.domains[0];
    let si = dm && dm[2] ? parseInt(dm[2], 10) - 1 : null;
    if(si !== null && !(si >= 0 && si < d.subs.length)) si = null;
    drawNav(d.id, si === null ? null : d.id + "-" + (si + 1));
    const p = $("panel");
    const show = () => { drawDomain(d, si); if(scroll){ const top = p.getBoundingClientRect().top + window.scrollY - 84; window.scrollTo({top: Math.max(0, top), behavior: "auto"}); } };
    if(reduceMotion) show();
    else { p.classList.add("swap"); setTimeout(() => { show(); p.classList.remove("swap"); }, 110); }
  }
  window.addEventListener("hashchange", () => route(true));
  route(false);
}
</script>
